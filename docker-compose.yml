version: "3.9"

services:
  # ── Streamlit app ─────────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data   # persist RAG index across restarts
    depends_on:
      - webhook
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Stripe webhook server ─────────────────────────────────────────────────
  webhook:
    build: .
    command: python app/webhook.py
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      WEBHOOK_PORT: "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
