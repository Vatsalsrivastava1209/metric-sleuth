name: Baseline CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: baseline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and sanity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import and syntax smoke check
        run: |
          python -m py_compile api/main.py api/dependencies.py api/tasks.py api/routers/analyze.py api/routers/datasets.py api/routers/ingest.py api/routers/reports.py api/schemas.py src/crypto.py src/db.py src/report_generator.py src/rag_query.py src/llm_summary.py

      - name: Run backend test suite
        run: |
          python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend production build
        run: npm run build
